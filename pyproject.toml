[project]
name = "tg"
version = "0.1.0"
description = "TG FATEC: desertos de cuidado em alcool e outras drogas (SP)"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
